[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "political-research"
version = "0.1.0"
description = "Thesis-driven, primary-source-grounded political research dossiers"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "openai>=1.67",
  "pgvector>=0.3",
  "psycopg2-binary>=2.9",
  "pypdf>=5.0",
  "requests>=2.32",
  "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
research = "research_app.cli:main"

[tool.setuptools.packages.find]
include = ["research_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

